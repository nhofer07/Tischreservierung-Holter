quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

quarkus.mongodb.connection-string=mongodb://localhost:27018
quarkus.mongodb.database=tischreservierung
quarkus.mongodb.devservices.enabled=false
quarkus.compose.devservices.enabled=false

# Microsoft Entra ID signiert das Identitätstoken für den geschützten /me-Endpunkt.
# Quarkus prüft Aussteller, Signatur und Zielgruppe der bereitgestellten Entra-App.
quarkus.oidc.auth-server-url=https://login.microsoftonline.com/14ddf41a-9afb-4810-bc22-227e34a9a007/v2.0
quarkus.oidc.client-id=8fe2707e-b93a-4657-ad94-d0440a067b8b
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=8fe2707e-b93a-4657-ad94-d0440a067b8b

# Im Produktionsprofil sind nur die Firmeneinstellungen öffentlich.
# Der lokale Passwort-Login bleibt dadurch eine reine Entwicklungsfunktion.
%prod.quarkus.http.auth.permission.public.paths=/api/einstellungen
%prod.quarkus.http.auth.permission.public.policy=permit
%prod.quarkus.http.auth.permission.authenticated.paths=/api/*
%prod.quarkus.http.auth.permission.authenticated.policy=authenticated
