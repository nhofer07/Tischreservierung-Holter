<main class="page">
  <header class="topbar">
    <button class="brand" type="button" aria-label="Zur Startseite" (click)="startOeffnen()">
      <img src="/holter-logo.png" alt="HOLTER" />
    </button>
    <nav>
      <span class="active">DeskVision</span>
      <span>Standorte</span>
      <span>Räume</span>
      <span>Reservierungen</span>
    </nav>
  </header>

  <app-intro
    *ngIf="aktiverSchritt() === 'start'"
    [standorte]="standorte()"
    [raum]="raum()"
    (standortOeffnen)="standortOeffnen($event)"
  />

  <app-room-overview
    *ngIf="aktiverSchritt() === 'raum' && raum()"
    [raum]="raum()!"
    [raeume]="raeume()"
    [ausgewaehlterTisch]="ausgewaehlterTisch()"
    [fehler]="fehler()"
    [zeitraum]="zeitraum()"
    (raumWechseln)="raumOeffnen($event)"
    (zeitraumPruefen)="zeitraumPruefen($event)"
    (tischAuswaehlen)="tischAuswaehlen($event)"
    (reservieren)="reservieren()"
  />
</main>
