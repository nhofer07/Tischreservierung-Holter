<section class="intro">
  <div class="copy">
    <p class="eyebrow">DeskVision</p>
    <h1>Arbeitsplatz reservieren.</h1>
    <p class="lead">
      Standort wählen, Raum öffnen, Arbeitsplatz anklicken.
    </p>

    <span class="selection-label">Standort</span>
    <div class="location-list" aria-label="Standort auswählen">
      <button
        *ngFor="let standort of standorteSignal()"
        type="button"
        class="location-card"
        [class.active]="selectedStandortId() === standort.id"
        (click)="standortAuswaehlen(standort.id)"
      >
        <span>{{ standort.name }}</span>
        <strong>{{ standort.ort }}</strong>
        <small>{{ standort.adresse }}</small>
      </button>
    </div>

    <button class="open-button" type="button" (click)="openSelectedRoom()">Raum öffnen</button>
  </div>

  <div class="preview">
    <span class="preview-title">{{ raumName() }}</span>
    <strong>8 Tische · {{ freieTische() }} frei</strong>
    <div class="preview-room" [ngClass]="previewLayout()">
      <i class="preview-door"></i>
      <i class="table free"></i>
      <i class="table reserved"></i>
      <i class="table free"></i>
      <i class="table free"></i>
      <i class="table free"></i>
      <i class="table reserved"></i>
      <i class="table free"></i>
      <i class="table free"></i>
    </div>
  </div>
</section>
