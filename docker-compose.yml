services:
  mongodb:
    image: mongo:7
    container_name: tischreservierung-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb-data:
